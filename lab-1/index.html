<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <style>
        body {
            background-color: #2b2622;
            color: #d4c4b7;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            padding-top: 80px;
            margin: 0;
        }
        .container {
            background-color: #3b342d;
            padding: 30px 40px;
            border-radius: 4px;
            border: 1px solid #5a5045;
            width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            font-weight: normal;
            border-bottom: 1px solid #5a5045;
            padding-bottom: 15px;
            margin-top: 0;
            letter-spacing: 1px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            background-color: #2b2622;
            border: 1px solid #5a5045;
            color: #d4c4b7;
            font-family: inherit;
            font-size: 1rem;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #8c7a6b;
        }
        button {
            padding: 10px 20px;
            background-color: #5a5045;
            color: #d4c4b7;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #726659;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dotted #5a5045;
        }
        .completed span {
            text-decoration: line-through;
            opacity: 0.5;
        }
        .actions button {
            padding: 5px 10px;
            margin-left: 5px;
            font-size: 0.9em;
            background-color: transparent;
            border: 1px solid #5a5045;
        }
        .actions button:hover {
            background-color: #5a5045;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>University Tasks</h1>
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Add new lecture or lab...">
        <button onclick="addTask()">Add</button>
    </div>
    <ul id="taskList"></ul>
</div>

<script>
    // Тепер ми звертаємося тільки до єдиного GraphQL endpoint
    const API_URL = '/graphql';

    // Універсальна функція для відправки GraphQL запитів
    async function fetchGraphQL(query, variables = {}) {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, variables })
            });
            if (!response.ok) throw new Error(`Помилка мережі: ${response.status}`);
            
            const result = await response.json();
            if (result.errors) {
                console.error("GraphQL помилки:", result.errors);
                throw new Error("Помилка при виконанні GraphQL запиту");
            }
            return result.data;
        } catch (error) {
            console.error("Fetch error:", error);
        }
    }

    // 1. Отримання завдань (Query)
    async function fetchTasks() {
        const query = `
            query {
                tasks {
                    _id
                    title
                    completed
                }
            }
        `;
        const data = await fetchGraphQL(query);
        if (data && data.tasks) {
            renderTasks(data.tasks);
        }
    }

    // Відображення завдань у DOM (Ця функція залишається майже без змін)
    function renderTasks(tasks) {
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        tasks.forEach(task => {
            const li = document.createElement('li');
            if (task.completed) li.classList.add('completed');
            
            li.innerHTML = `
                <span>${task.title}</span>
                <div class="actions">
                    <button onclick="toggleTask('${task._id}', ${!task.completed})" title="Change status">✓</button>
                    <button onclick="deleteTask('${task._id}')" title="Delete">✗</button>
                </div>
            `;
            list.appendChild(li);
        });
    }

    // 2. Додавання завдання (Mutation)
    async function addTask() {
        const input = document.getElementById('taskInput');
        const title = input.value.trim();
        if (!title) return;

        const query = `
            mutation CreateTask($title: String!) {
                createTask(title: $title) {
                    _id
                    title
                    completed
                }
            }
        `;
        
        await fetchGraphQL(query, { title });
        
        input.value = '';
        fetchTasks(); // Оновлюємо список
    }

    // 3. Оновлення статусу (Mutation)
    // Зверни увагу: у твоїй схемі updateTask приймає id (ID!), title (String), description (String) і completed (Boolean)
    async function toggleTask(id, isCompleted) {
        const query = `
            mutation UpdateTask($id: ID!, $completed: Boolean) {
                updateTask(id: $id, completed: $completed) {
                    _id
                    completed
                }
            }
        `;
        
        await fetchGraphQL(query, { id, completed: isCompleted });
        fetchTasks(); // Оновлюємо список
    }

    // 4. Видалення завдання (Mutation)
    async function deleteTask(id) {
        const query = `
            mutation DeleteTask($id: ID!) {
                deleteTask(id: $id)
            }
        `;
        
        await fetchGraphQL(query, { id });
        fetchTasks(); // Оновлюємо список
    }

    // Завантажуємо дані при відкритті сторінки
    fetchTasks();
</script>

</body>
</html>
